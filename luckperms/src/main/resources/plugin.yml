name: LuckPermsOldschool
version: '1.0'
description: A permissions plugin for Minecraft Oldschool Edition servers
author: Luck (Backported for MCOSE)
website: https://luckperms.net
main: me.lucko.luckperms.bukkit.LPBukkitLoaderPlugin

# Load before Vault for proper integration
loadbefore: [Vault]

commands:
  luckperms:
    description: Manage permissions
    aliases: [lp, perm, perms, permission, permissions]
    usage: /<command> [args]

permissions:
  luckperms.*:
    description: Gives access to all LuckPerms commands
    default: op
  luckperms.user:
    description: Manage user permissions
    default: op
  luckperms.group:
    description: Manage group permissions
    default: op
  luckperms.editor:
    description: Access the web editor
    default: op
  luckperms.applyedits:
    description: Apply edits from the web editor
    default: op
  luckperms.sync:
    description: Sync permissions
    default: op
  luckperms.reload:
    description: Reload configuration
    default: op

