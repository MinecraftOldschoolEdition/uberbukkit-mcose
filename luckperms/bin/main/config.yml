# LuckPerms Configuration
# Backported for Uberbukkit/Project Poseidon

# Storage method
# Options: yaml, json
# Note: SQL backends not yet implemented in this backport
storage-method: yaml

# Enable operator status
# If set to false, the /op command will be disabled
enable-ops: true

# Auto-op
# If enabled, players with the 'luckperms.autoop' permission will be opped automatically
auto-op: false

# Debug logins
# If enabled, detailed login process information will be logged
debug-logins: false

# Server name for server-specific permissions
# Leave blank to not use server-specific contexts
server: ""

# Include global permissions
# If enabled, permissions without a server context will apply on this server
include-global: true

# Include global world permissions  
# If enabled, permissions without a world context will apply in all worlds
include-global-world: true

# Apply wildcards
# If enabled, wildcard permissions like "plugin.*" will work
apply-wildcards: true

# Apply regex
# If enabled, regex permissions like "r=plugin\\..*" will work
apply-regex: false

# Commands allow OP
# If enabled, OPs can use LuckPerms commands without explicit permission
commands-allow-op: true

# Primary group calculation
# Options: stored, parents-by-weight, all-parents-by-weight
primary-group-calculation: stored

